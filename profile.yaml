main_projects:
  - repo: rhuss/cc-spex
    name: cc-spex
    emoji: "📐"
    description: >-
      Spec-driven development for Claude Code, Codex and OpenCode, built as extensions on top of GitHub's Spec-Kit.
      Adds brainstorming, review gates after spec and plan, worktree isolation, parallel agent teams and spec/code drift checks.
      A two-phase flow puts the spec up for review before any code is written.

  - repo: AgentTacho/agenttacho
    name: AgentTacho
    url: https://agenttacho.dev
    emoji: "⏱️"
    description: >-
      macOS menu bar app that shows coding-agent usage per account: Claude and Codex plan limits with reset times, and spend against a budget for pay-per-token accounts.
      Reads the logs that Claude Code, Codex and OpenCode already write locally, with a breakdown per model and project and notifications when a threshold is crossed.

  - repo: rhuss/cc-guide
    name: cc-guide
    emoji: "🧭"
    description: >-
      Plugin for Claude Code, Codex and OpenCode that writes guides from source repositories, transcripts and notes, page by page.
      A fresh reviewer checks every page against sources pinned to exact commits.
      When the sources change, it finds the pages that cite changed files and updates only those.

  - repo: tals/corgi
    name: Corgi
    emoji: "🐕"
    description: >-
      Terminal multiplexer built on Ghostty for running coding agents such as Claude Code, Codex and OpenCode side by side, with per-agent status, activity summaries and session resume.
      Roland contributes to Corgi and helps support the project.

  - repo: rhuss/debaser
    name: debaser
    emoji: "🩹"
    description: >-
      Keeps a patched build of someone else's GitHub project: upstream plus an ordered list of patches (upstream PRs, branches from other forks, own branches).
      Each build merges the patches, runs the project's checks and each patch's acceptance check, and installs a runnable artifact while keeping the previous one as fallback.
      Merge conflicts and failed checks can be handed to an AI agent, and every agent change lands as its own commit.

  - repo: rhuss/aprofile
    name: aprofile
    emoji: "👤"
    description: >-
      Gives each account and endpoint of Claude Code, Codex, OpenCode and pi its own command, such as claude-work and claude-personal.
      Every profile gets its own login, settings and history, and groups decide which profiles share conversations.
      Covers work and personal accounts, client accounts, and company LLM gateways.

  - repo: rhuss/cc-review
    name: cc-review
    emoji: "🔍"
    description: >-
      Code review plugin for Claude Code, Codex and OpenCode that runs six specialized reviewers and merges their findings with those of CodeRabbit, Copilot and other tools.
      A fix loop resolves Critical and Important findings before the report is shown.
      The same reviews, plus PR comment triage and issue assessment, can run unattended in GitHub Actions.

  - repo: rhuss/cc-prose
    name: cc-prose
    emoji: "🖋️"
    description: >-
      Writing skills for Claude Code, Codex and OpenCode that produce text in a consistent voice and avoid typical AI writing patterns.
      Ships eight voice profile templates, extracts new profiles from existing writing samples, and applies a 24-pattern humanizer while writing instead of afterwards.

