# Regenerates README.md and data/snapshot.json from profile.yaml plus live
# data (FR-016, FR-016a, FR-017, FR-018, FR-019a).
#
# Commits pushed with GITHUB_TOKEN do not trigger new workflow runs, so the
# push trigger cannot loop.
name: Refresh profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.yaml
      - "templates/**"
      - "assets/**"

permissions:
  contents: write

jobs:
  refresh:
    # Push runs only on the default branch, whatever its name is.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    # Job-level, so skipped runs for other branches never take the slot of a
    # pending default-branch run.
    concurrency:
      group: refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs because the job holds a write token.
      # A branch name as ref checks out the current branch tip, not the commit
      # that triggered the run, so a run that waited in the concurrency queue
      # renders from the latest profile.yaml (the schedule payload carries no
      # repository object, so github.ref_name is used for every event).
      - name: Check out (full history for the keep-alive check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # Exit 1 (data-file validation error) fails the job here, before any
      # commit. Warnings exit 0 and appear as annotations.
      - name: Render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked profilegen render

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # git add first so that files missing from the index on a first run
      # count as changes.
      - name: Commit README and snapshot if changed
        run: |
          git add -- README.md data/snapshot.json
          if git diff --cached --quiet -- README.md data/snapshot.json; then
            echo "README and snapshot unchanged, nothing to commit"
          else
            git commit -m "chore: refresh profile README"
          fi

      # Runs after the content commit, so a fresh content commit resets the
      # clock and no empty commit is added.
      - name: Keep the schedule alive
        run: |
          rc=0
          uv run --locked profilegen keepalive --days 50 || rc=$?
          case "$rc" in
            0) git commit --allow-empty -m "chore: keep scheduled refresh alive" ;;
            3) echo "No keep-alive commit needed" ;;
            *) echo "::error::profilegen keepalive failed with exit code $rc"; exit 1 ;;
          esac

      - name: Push if ahead
        run: |
          ahead=$(git rev-list --count '@{u}..HEAD')
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing to push"
            exit 0
          fi
          for attempt in 0 1 2 3; do
            if [ "$attempt" -gt 0 ]; then
              echo "Push rejected, rebasing onto the remote (retry $attempt of 3)"
              sleep $((attempt * 5))
              if ! git pull --rebase; then
                git rebase --abort || true
                echo "::error::rebase onto the remote conflicted; the next run regenerates README.md and data/snapshot.json"
                exit 1
              fi
            fi
            if git push; then
              exit 0
            fi
          done
          echo "::error::push failed after 3 retries"
          exit 1
