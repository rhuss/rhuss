[project]
name = "profilegen"
version = "0.1.0"
description = "Generate the rhuss GitHub profile README from profile.yaml plus live data"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
profilegen = "profilegen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profilegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
